<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item 7 pickup card</title>
<style>
  :root{--ink:#111;--muted:#555;--bg:#f4f4f5;--ok:#188038;--bad:#8a1c12;--badbg:#fce8e6}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:440px;margin:0 auto;padding:22px 16px 48px}
  h1{font-size:24px;line-height:1.15;margin:6px 0 4px}
  .sub{margin:0 0 18px;color:var(--muted);font-size:14px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  input{width:100%;font-size:18px;padding:13px 12px;border:1px solid #c9c9cf;border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:3px solid #9fc3ff;border-color:#4a86e8}
  button,.btn{display:block;width:100%;margin-top:18px;font-size:17px;font-weight:700;padding:15px;border:0;border-radius:10px;background:var(--ink);color:#fff;text-align:center;text-decoration:none;cursor:pointer}
  button:disabled{opacity:.6}
  .btn.ok{background:var(--ok)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid #c9c9cf}
  .msg{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--badbg);color:var(--bad);font-size:15px}
  .card{display:none;margin-top:16px;text-align:center}
  .card img{width:100%;border-radius:14px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.12)}
  .meta{font-size:15px;margin:12px 0 0;line-height:1.6}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Item 7 pickup card</h1>
  <p class="sub">For Swoop riders. Enter your order and phone number, then show the card at the Item 7 outlet.</p>

  <form id="form" autocomplete="on">
    <label for="order">Swoop order number</label>
    <input id="order" name="order" placeholder="e.g. THM-1123-13541 or 13541" autocapitalize="characters" autocomplete="off" required>
    <label for="phone">Your phone number</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="e.g. 08031234567" autocomplete="tel" required>
    <button id="go" type="submit">Get pickup card</button>
  </form>

  <div class="msg" id="msg" role="alert"></div>

  <div class="card" id="card">
    <img id="img" alt="Item 7 pickup card">
    <div class="meta" id="meta"></div>
    <a class="btn ok" id="dl" download="pickup.png">Download pickup card</a>
    <p class="hint">If download does not work, press and hold the card and choose Save image.</p>
    <button class="btn ghost" id="again" type="button">Look up another order</button>
  </div>
</div>

<script>
{
  // Google Apps Script API behind the "Item 7 Rider Pickups" sheet
  const API = 'https://script.google.com/macros/s/AKfycbys6QjhNjHbDZdOZ0UwQli9I6zYKgccfsOf-_7-WiNNXYX5qlS2zA2Dy4JdbEbU8Sw9jw/exec';
  const $ = (id) => document.getElementById(id);
  const show = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  const fail = (text) => { $('msg').textContent = text; show('msg', true); };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  try { const saved = localStorage.getItem('riderPhone'); if (saved) $('phone').value = saved; } catch (e) {}

  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const order = $('order').value.trim();
    const phone = $('phone').value.trim();
    const btn = $('go');
    show('msg', false);
    btn.disabled = true; btn.textContent = 'Checking...';
    try {
      const url = API + '?order=' + encodeURIComponent(order) + '&phone=' + encodeURIComponent(phone);
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 30000);
      // credentials: 'omit' keeps the rider's Google accounts out of it, which avoids
      // Google's "unable to open the file" error for people signed in to several accounts
      const res = await fetch(url, { credentials: 'omit', redirect: 'follow', signal: ctl.signal });
      clearTimeout(timer);
      const r = await res.json();
      if (!r.ok) { fail(r.msg || 'We could not match that order and phone number.'); return; }
      try { localStorage.setItem('riderPhone', phone); } catch (e) {}
      $('img').src = r.image;
      $('dl').href = r.image;
      $('dl').download = (r.order || 'pickup') + '.png';
      $('meta').innerHTML = '<b>' + esc(r.order) + '</b><br>' + esc(r.outlet) +
        '<br>Item 7 order ID: <b>' + esc(r.item7OrderId) + '</b>' +
        (r.pickupTime ? '<br>Ready from: ' + esc(r.pickupTime) : '');
      show('form', false); show('card', true);
      window.scrollTo(0, 0);
    } catch (e) {
      fail(e.name === 'AbortError' ? 'This is taking too long. Check your internet and try again.' : 'Could not connect. Check your internet and try again.');
    } finally {
      btn.disabled = false; btn.textContent = 'Get pickup card';
    }
  });

  $('again').addEventListener('click', () => {
    show('card', false); show('form', true); $('order').value = ''; $('order').focus();
  });
}
</script>
</body>
</html>
